substitutions:
  device_name: huehnerstall
  device_friendly_name: Huehnerstall
  board_type: esp32dev
  timezone: Europe/Berlin
  latitude: "49.4875"
  longitude: "8.4660"
  watchdog_retry_sec: "300"      # Mindestabstand (5 Min) zwischen automatischen Korrekturversuchen
  # Offsets werden zur Laufzeit direkt über die HA-Zahlenentitäten gesteuert
  cover_travel_time: 18s         # Zeit, die die Klappe für den kompletten Weg benötigt
  status_led_pin: GPIO2
  
  # Relais-Pin-Belegung (Logik-Ebene)
  relay_open_pin: GPIO26    # Relais 2: Öffnen der Klappe
  relay_close_pin: GPIO25   # Relais 1: Schließen der Klappe
  relay_aux_pin: GPIO33     # Relais 3: Hilfsrelais (Hauptschalter/Sicherheitsschalter)
  relay_light_pin: GPIO32   # Relais 4: Lichtsteuerung
  relay_outputs_inverted: false # true falls die Relaisplatine Low-Level-Trigger nutzt
  
  # Taster-Eingänge (Physische Onboard-Buttons)
  btn_close_1_pin: GPIO35   # Button 1: Schließen manuell (Onboard)
  btn_open_pin: GPIO34      # Button 2: Öffnen manuell (Onboard)
  btn_light_pin: GPIO36     # Button 3: Licht manuell toggeln (Onboard)
  btn_safety_open_pin: GPIO13 # Button 4: Klemmschutzkontakt, öffnet die Klappe sofort (Onboard, interner Pullup)
  rf_receiver_pin: GPIO27   # Signal-Pin des 433MHz RF-Empfängers

  # Externe Gehäuse-Taster (Neu aus den Debug-Funktionen überführt)
  btn_ext_open_pin: GPIO23  # Taster Außen: Klappe direkt öffnen (mit internem Pullup)
  btn_ext_close_pin: GPIO19 # Taster Außen: Klappe direkt schließen (mit internem Pullup)
  btn_ext_light_pin: GPIO18 # Taster Außen: Licht direkt toggeln (mit internem Pullup)

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("boot", "Starte %s (%s)", "${device_friendly_name}", "${device_name}");
          ESP_LOGI(
            "boot",
            "Konfiguration: Öffnen %d Min nach Sonnenaufgang, Schließen %d Min nach Sonnenuntergang, Watchdog-Wartezeit %s s, Fahrzeit %s, Zeitzone %s",
            (int) id(sunrise_open_offset_num).state,
            (int) id(sunset_close_offset_num).state,
            "${watchdog_retry_sec}",
            "${cover_travel_time}",
            "${timezone}"
          );
          ESP_LOGI(
            "boot",
            "Standort: Breitengrad %s, Längengrad %s, invertierte Relaislogik %s",
            "${latitude}",
            "${longitude}",
            "${relay_outputs_inverted}"
          );
          ESP_LOGI(
            "boot",
            "Klappenstatus nach Neustart wird ausschließlich über das interne time_based-Cover-Modell bewertet; ohne Endschalter ist das eine Annahme, kein gemessener Istzustand."
          );
      - component.update: calculated_open_time_text
      - component.update: calculated_close_time_text

esp32:
  board: ${board_type}
  framework:
    type: esp-idf # Nutzt das stabile ESP-IDF Framework statt Arduino

logger:
  level: DEBUG # Ausführliches Logging für die Fehlersuche im seriellen Monitor

api:
  reboot_timeout: 0s # Verhindert, dass der ESP bei fehlender Home Assistant Verbindung neu startet
  encryption:
    key: !secret huehnerstall__encryption_key

ota:
  - platform: esphome
    allow_partition_access: true
    password: !secret huehnerstall__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_friendly_name} Fallback
    password: !secret fallback_password
captive_portal:

web_server:
  port: 80

# Lokale Zeitbasis via NTP (ermöglicht autarken Betrieb ohne Smarthome-Zentrale)
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org

globals:
  # Flag: Signalisiert, ob der Watchdog gerade einen Befehl ausführt (um Falsch-Trigger zu verhindern)
  - id: watchdog_is_executing
    type: bool
    restore_value: false
    initial_value: "false"
  # Zeitstempel zur Absicherung gegen zu schnelles, wiederholtes Schalten bei Blockaden
  - id: last_watchdog_action_at
    type: int
    restore_value: false
    initial_value: "0"

script:
  - id: action_open_klappe
    mode: queued
    then:
      - logger.log: "Manuelle Bedienung: Stallklappe öffnen. Automatik wird vorübergehend pausiert."
      - switch.turn_on: manual_override_switch
      - cover.open: stallklappe

  - id: action_close_klappe
    mode: queued
    then:
      - logger.log: "Manuelle Bedienung: Stallklappe schließen. Automatik wird vorübergehend pausiert."
      - switch.turn_on: manual_override_switch
      - cover.close: stallklappe

  - id: action_toggle_light
    mode: queued
    then:
      - logger.log:
          format: "Manuelle Bedienung: Licht wird umgeschaltet (%s -> %s)."
          args: [ 'id(relay_light).state ? "EIN" : "AUS"', 'id(relay_light).state ? "AUS" : "EIN"' ]
      - switch.toggle: relay_light
    
sun:
  id: sun_hub
  latitude: ${latitude}
  longitude: ${longitude}

status_led:
  pin:
    number: ${status_led_pin}
    inverted: true

switch:
  - platform: gpio
    id: relay_open
    name: "Stallklappe Auf (Relais 2)"
    internal: true
    interlock: [relay_close] # Gegenseitige Verriegelung
    pin:
      number: "${relay_open_pin}"
      inverted: ${relay_outputs_inverted}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay_close
    name: "Stallklappe Zu (Relais 1)"
    internal: true
    interlock: [relay_open] # Gegenseitige Verriegelung
    pin:
      number: "${relay_close_pin}"
      inverted: ${relay_outputs_inverted}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay_aux
    name: "Hilfsrelais (Relais 3)"
    internal: true
    pin:
      number: "${relay_aux_pin}"
      inverted: ${relay_outputs_inverted}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay_light
    name: "Licht Relais (Relais 4)"
    internal: true
    pin:
      number: "${relay_light_pin}"
      inverted: ${relay_outputs_inverted}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: restart
    name: "ESP Neustart"
    internal: true

  - platform: template
    id: manual_override_switch
    name: "Manuelle Bedienung aktiv"
    icon: "mdi:hand-back-right"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - logger.log: "Manuelle Bedienung erkannt: Automatik pausiert."
    turn_off_action:
      - logger.log: "Manuelle Bedienung beendet: Automatik aktiv."
    
binary_sensor:
  - platform: status
    name: "Controller Online"
    internal: true

  # ==========================================================================
  # --- ALLE ÖFFNEN-TASTER ---
  # ==========================================================================
  - platform: gpio
    id: btn_open
    pin: { number: "${btn_open_pin}", mode: INPUT, inverted: true }
    on_press:
      - logger.log: "Taster innen betätigt: Stallklappe öffnen."
      - script.execute: action_open_klappe

  - platform: gpio
    id: btn_ext_open_geo
    pin: { number: "${btn_ext_open_pin}", mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "Außentaster betätigt: Stallklappe öffnen."
      - script.execute: action_open_klappe

  - platform: remote_receiver
    id: rf_open_geo
    rc_switch_raw: { code: '010111000101010000000010', protocol: 1 }
    on_press:
      - logger.log: "Funkfernbedienung ausgelöst: Stallklappe öffnen."
      - script.execute: action_open_klappe

  # ==========================================================================
  # --- SCHLIESSEN- UND KLEMMSCHUTZ-TASTER ---
  # ==========================================================================
  - platform: gpio
    id: btn_close_1
    pin: { number: "${btn_close_1_pin}", mode: INPUT, inverted: true }
    on_press:
      - logger.log: "Taster innen 1 betätigt: Stallklappe schließen."
      - script.execute: action_close_klappe

  - platform: gpio
    id: btn_safety_open
    pin: { number: "${btn_safety_open_pin}", mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "Klemmschutzkontakt geöffnet: Stallklappe wird sofort geöffnet."
      #- switch.turn_on: manual_override_switch
      #- cover.open: stallklappe
    on_release:
      - logger.log:
          level: DEBUG
          format: "Klemmschutzkontakt Flanke: INAKTIV/RUHE (state=false, Pin %s)"
          args:
            - '"${btn_safety_open_pin}"'

  - platform: gpio
    id: btn_ext_close_geo
    pin: { number: "${btn_ext_close_pin}", mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "Außentaster betätigt: Stallklappe schließen."
      - script.execute: action_close_klappe

  - platform: remote_receiver
    id: rf_close_geo
    rc_switch_raw: { code: '010111000101010000001000', protocol: 1 }
    on_press:
      - logger.log: "Funkfernbedienung ausgelöst: Stallklappe schließen."
      - script.execute: action_close_klappe

  # ==========================================================================
  # --- ALLE LICHT-TASTER ---
  # ==========================================================================
  - platform: gpio
    id: btn_light
    pin: { number: "${btn_light_pin}", mode: INPUT, inverted: true }
    on_press:
      - logger.log: "Taster innen betätigt: Licht umschalten."
      - script.execute: action_toggle_light

  - platform: gpio
    id: btn_ext_light_geo
    pin: { number: "${btn_ext_light_pin}", mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "Außentaster betätigt: Licht umschalten."
      - script.execute: action_toggle_light

  - platform: remote_receiver
    id: rf_light_geo
    rc_switch_raw: { code: '010111000101010000000100', protocol: 1 }
    on_press:
      - logger.log: "Funkfernbedienung ausgelöst: Licht umschalten."
      - script.execute: action_toggle_light

remote_receiver:
  pin:
    number: ${rf_receiver_pin}
    mode:
      input: true
      pullup: false
  dump: rc_switch
  tolerance: 60%
  filter: 10us
  idle: 4ms
  buffer_size: 4kb

cover:
  - platform: time_based
    id: stallklappe
    name: "Stallklappe"
    open_action:
      - logger.log: "Stallklappe startet die Öffnungsfahrt. Hilfsrelais und Öffnen-Relais sind eingeschaltet."
      - lambda: |-
          if (!id(watchdog_is_executing)) {
            id(manual_override_switch).turn_on();
          }
      - switch.turn_on: relay_aux
      - switch.turn_on: relay_open
    open_duration: ${cover_travel_time}
    close_action:
      - logger.log: "Stallklappe startet die Schließfahrt. Hilfsrelais und Schließen-Relais sind eingeschaltet."
      - lambda: |-
          if (!id(watchdog_is_executing)) {
            id(manual_override_switch).turn_on();
          }
      - switch.turn_on: relay_aux
      - switch.turn_on: relay_close
    close_duration: ${cover_travel_time}
    stop_action:
      - logger.log: "Stallklappe wurde gestoppt. Öffnen-, Schließen- und Hilfsrelais sind ausgeschaltet."
      - lambda: |-
          id(watchdog_is_executing) = false;
      - switch.turn_off: relay_open
      - switch.turn_off: relay_close
      - switch.turn_off: relay_aux

interval:
  # 5-Sekunden-Takt: Debug-Ausgabe für den Klemmschutzkontakt (Pin 13)
  - interval: 5s
    then:
      - logger.log:
          level: DEBUG
          format: "Klemmschutz-Status (Pin %s): %s"
          args:
            - '"${btn_safety_open_pin}"'
            - 'id(btn_safety_open).state ? "AUSGELOEST/OPEN" : "RUHE/CLOSED"'

  # 30-Sekunden-Takt: Die primäre Steuerungs- und Watchdog-Logik
  - interval: 30s
    then:
      - lambda: |-
          auto format_sod = [](int sod, char* buffer, size_t len) {
            const int normalized = ((sod % 86400) + 86400) % 86400;
            snprintf(buffer, len, "%02d:%02d:%02d", normalized / 3600, (normalized / 60) % 60, normalized % 60);
          };
          constexpr double sun_event_elevation = -0.83333;

          // 1. Zeitprüfung: Wenn NTP-Zeit noch nicht synchronisiert ist, abbrechen
          auto now = id(sntp_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("watchdog", "Zeit noch nicht synchronisiert. Die Automatikprüfung wird übersprungen.");
            return;
          }

          // 2. Astro-Daten direkt aus der nativen Sun-Komponente holen
          auto sunrise = id(sun_hub).sunrise(sun_event_elevation);
          auto sunset = id(sun_hub).sunset(sun_event_elevation);
          if (!sunrise.has_value() || !sunset.has_value()) {
            ESP_LOGW("watchdog", "Sonnenaufgang oder Sonnenuntergang konnte noch nicht berechnet werden.");
            return;
          }

          const auto rise = sunrise.value();
          const auto set = sunset.value();

          // 3. Berechnung der "Seconds of Day" (Sekunden seit Mitternacht)
          const int now_sod = now.hour * 3600 + now.minute * 60 + now.second;
          const int rise_sod = rise.hour * 3600 + rise.minute * 60 + rise.second;
          const int set_sod = set.hour * 3600 + set.minute * 60 + set.second;

          // 4. Offsets einrechnen (Minuten -> Sekunden; kann negativ sein)
          int open_from_sod = rise_sod + (int) id(sunrise_open_offset_num).state * 60;
          int open_until_sod = set_sod + (int) id(sunset_close_offset_num).state * 60;

          // Überlaufkorrektur: Ergebnis in den Bereich [0, 86400) bringen
          open_from_sod  = ((open_from_sod  % 86400) + 86400) % 86400;
          open_until_sod = ((open_until_sod % 86400) + 86400) % 86400;

          // 5. Soll-Zustand anhand der aktuellen Uhrzeit ermitteln
          bool should_be_open;
          if (open_from_sod <= open_until_sod) {
            // Normalfall: Das "Offen-Fenster" liegt komplett innerhalb desselben Kalendertages
            should_be_open = now_sod >= open_from_sod && now_sod < open_until_sod;
          } else {
            // Sonderfall: Das Zeitfenster überschreitet die Mitternachtsgrenze
            should_be_open = now_sod >= open_from_sod || now_sod < open_until_sod;
          }

          const bool is_open = id(stallklappe).position > 0.5f;
          char now_buf[9];
          char rise_buf[9];
          char set_buf[9];
          char open_from_buf[9];
          char open_until_buf[9];
          format_sod(now_sod, now_buf, sizeof(now_buf));
          format_sod(rise_sod, rise_buf, sizeof(rise_buf));
          format_sod(set_sod, set_buf, sizeof(set_buf));
          format_sod(open_from_sod, open_from_buf, sizeof(open_from_buf));
          format_sod(open_until_sod, open_until_buf, sizeof(open_until_buf));

          ESP_LOGD("watchdog", "Statusuebersicht:");
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Feld", "Wert");
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Zeit", now_buf);
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Sonnenaufgang", rise_buf);
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Sonnenuntergang", set_buf);
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Oeffnen ab", open_from_buf);
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Schliessen ab", open_until_buf);
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Sollzustand", should_be_open ? "offen" : "geschlossen");
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Cover-Annahme", is_open ? "offen" : "geschlossen");
          ESP_LOGD("watchdog", "  %-18s | %-24.2f", "Position", id(stallklappe).position);
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Manueller Override", id(manual_override_switch).state ? "aktiv" : "inaktiv");
          ESP_LOGD("watchdog", "  %-18s | %-24s", "Quelle", "Laufzeitstatus");

          // Statischer Speicher behält den Wert über den Durchlauf hinweg im RAM
          static bool last_should_be_open = should_be_open;
          static bool override_logged = false;

          // 7. Automatischer Reset des Overrides bei regulärem Zustandswechsel am Morgen/Abend
          if (should_be_open != last_should_be_open) {
            ESP_LOGI(
              "watchdog",
              "Zeitfenster gewechselt: jetzt %s, neuer Sollzustand %s. Manueller Override wird zurückgesetzt.",
              now_buf,
              should_be_open ? "offen" : "geschlossen"
            );
            id(manual_override_switch).turn_off();
            override_logged = false;
            last_should_be_open = should_be_open;
          }

          // 8. Override-Prüfung: Wenn manuell eingegriffen wurde, hier abbrechen (Automatik pausiert)
          if (id(manual_override_switch).state) {
            if (!override_logged) {
              ESP_LOGI(
                "watchdog",
                "Automatik pausiert wegen manueller Bedienung: jetzt %s, Sollzustand %s, Istzustand %s.",
                now_buf,
                should_be_open ? "offen" : "geschlossen",
                is_open ? "offen" : "geschlossen"
              );
              override_logged = true;
            }
            return;
          }
          override_logged = false;

          // 9. Watchdog-Ist/Soll-Vergleich
          if (should_be_open == is_open) {
            ESP_LOGD("watchdog", "Kein Eingriff nötig. Angenommener Cover-Zustand und Sollzustand stimmen überein.");
            return; // Zustand korrekt -> Nichts tun
          }

          // 10. Wiederhol-Sperre prüfen (Verhindert Relais-Flattern bei Blockaden)
          if ((now.timestamp - id(last_watchdog_action_at)) < ${watchdog_retry_sec}) {
            const int retry_remaining_sec = (int) (${watchdog_retry_sec} - (now.timestamp - id(last_watchdog_action_at)));
            ESP_LOGW(
              "watchdog",
              "Abweichung erkannt, aber die Wartezeit für den nächsten Korrekturversuch läuft noch (%d s verbleibend).",
              retry_remaining_sec
            );
            return;
          }

          // 11. Korrektur-Befehl senden, falls eine Abweichung vorliegt
          id(last_watchdog_action_at) = now.timestamp;
          id(watchdog_is_executing) = true;  // Flag setzen: Der Watchdog führt einen Befehl aus
          if (should_be_open) {
            ESP_LOGI("watchdog", "Sollzustand offen, angenommener Cover-Zustand geschlossen. Öffnen wird im internen Cover-Modell nachgeholt.");
            id(stallklappe).make_call().set_command_open().perform();
          } else {
            ESP_LOGI("watchdog", "Sollzustand geschlossen, angenommener Cover-Zustand offen. Schließen wird im internen Cover-Modell nachgeholt.");
            id(stallklappe).make_call().set_command_close().perform();
          }

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime Sekunden"

number:
  - platform: template
    id: sunrise_open_offset_num
    name: "Öffnen: Versatz nach Sonnenaufgang (Min)"
    icon: "mdi:weather-sunset-up"
    min_value: -120
    max_value: 120
    step: 1
    optimistic: true
    initial_value: 30
    set_action:
      - component.update: calculated_open_time_text
    unit_of_measurement: min
    restore_value: true

  - platform: template
    id: sunset_close_offset_num
    name: "Schließen: Versatz nach Sonnenuntergang (Min)"
    icon: "mdi:weather-sunset-down"
    min_value: -120
    max_value: 120
    step: 1
    optimistic: true
    initial_value: 20
    set_action:
      - component.update: calculated_close_time_text
    unit_of_measurement: min
    restore_value: true

text_sensor:
  - platform: sun
    id: next_sunrise_text
    name: "Nächster Sonnenaufgang"
    type: sunrise
    format: "%Y-%m-%d %H:%M:%S"

  - platform: sun
    id: next_sunset_text
    name: "Nächster Sonnenuntergang"
    type: sunset
    format: "%Y-%m-%d %H:%M:%S"

  - platform: template
    id: calculated_open_time_text
    name: "Klappe öffnet um"
    icon: "mdi:door-open"
    update_interval: 60s
    lambda: |-
      constexpr double sun_event_elevation = -0.83333;
      auto sunrise = id(sun_hub).sunrise(sun_event_elevation);
      if (!sunrise.has_value()) return {"--:--"};
      const auto rise = sunrise.value();
      int sod = rise.hour * 3600 + rise.minute * 60 + rise.second + (int) id(sunrise_open_offset_num).state * 60;
      sod = ((sod % 86400) + 86400) % 86400;
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", sod / 3600, (sod / 60) % 60);
      return {buf};

  - platform: template
    id: calculated_close_time_text
    name: "Klappe schließt um"
    icon: "mdi:door-closed"
    update_interval: 60s
    lambda: |-
      constexpr double sun_event_elevation = -0.83333;
      auto sunset = id(sun_hub).sunset(sun_event_elevation);
      if (!sunset.has_value()) return {"--:--"};
      const auto set = sunset.value();
      int sod = set.hour * 3600 + set.minute * 60 + set.second + (int) id(sunset_close_offset_num).state * 60;
      sod = ((sod % 86400) + 86400) % 86400;
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", sod / 3600, (sod / 60) % 60);
      return {buf};